name: Android APK Build

on:
  push:
    tags:
      - '*' # Triggers on any tag push

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean Build Directory
        run: rm -rf app/build

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Setup Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Verify Keystore File
        run: |
          if [ -s "keystore.jks" ]; then
            echo "Keystore file exists and is non-empty."
          else
            echo "Keystore file is missing or empty!" && exit 1
          fi

      - name: Resolve Signing Alias
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "ANDROID_KEYSTORE_PASSWORD is required." && exit 1
          fi

          detected_alias="$(keytool -list -keystore keystore.jks -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            | sed -n 's/^\([^,][^,]*\), .*/\1/p' \
            | head -n 1)"

          if [ -z "${detected_alias}" ]; then
            echo "Unable to detect a key alias from keystore.jks." && exit 1
          fi

          if [ -n "${ANDROID_KEY_ALIAS}" ] && ! keytool -list -keystore keystore.jks -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" > /dev/null 2>&1; then
            echo "Configured ANDROID_KEY_ALIAS was not found in keystore.jks; using detected alias."
            echo "ANDROID_KEY_ALIAS=${detected_alias}" >> "${GITHUB_ENV}"
          elif [ -z "${ANDROID_KEY_ALIAS}" ]; then
            echo "ANDROID_KEY_ALIAS is not set; using detected alias."
            echo "ANDROID_KEY_ALIAS=${detected_alias}" >> "${GITHUB_ENV}"
          fi

      - name: Build Release APK
        run: |
          ./gradlew clean assembleRelease

      - name: List APK Outputs
        run: find app/build/outputs/apk -type f -name "*.apk"

      - name: Upload APK Artifact (Release)
        uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk